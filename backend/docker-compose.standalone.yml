# Standalone deployment with Caddy reverse proxy
# Use this when you don't have an external reverse proxy (like YunoHost, Traefik, etc.)
#
# Usage:
#   docker compose -f docker-compose.standalone.yml up -d
#
# Or use the setup script:
#   ./setup.sh

include:
  - docker-compose.prod.yml

services:
  caddy:
    image: caddy:2-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    container_name: chord-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - chord-network
    depends_on:
      - api
      - livekit
      - minio
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:



