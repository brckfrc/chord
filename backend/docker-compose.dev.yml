services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56
    container_name: chord-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ../scripts/healthcheck-sql.sh:/healthcheck-sql.sh:ro
    networks:
      - chord-network
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash /healthcheck-sql.sh || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: chord-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chord-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: chord-minio
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - chord-network
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  livekit:
    image: livekit/livekit-server:latest@sha256:50409575b8a4c4d4e5496793ba698701a230bc5d0f33e54dbe6877ba6e325a9f
    container_name: chord-livekit
    environment:
      # Format must be "key: secret" with a space after colon
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET}"
      # Node IP for LAN access (set in .env for remote access)
      LIVEKIT_NODE_IP: "${LIVEKIT_NODE_IP:-}"
    ports:
      - "${LIVEKIT_WS_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_PORT:-7881}:7881/udp"
      - "${LIVEKIT_RTC_PORT:-7881}:7881/tcp"
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro
    command: --config /livekit.yaml --node-ip ${LIVEKIT_NODE_IP:-}
    networks:
      - chord-network
    restart: unless-stopped
    depends_on:
      - redis

  coturn:
    image: coturn/coturn:latest@sha256:0c0e8fc0c263b85a134e9e4242b5e46e1f4c077c5029633511191c05b5c2c814
    container_name: chord-coturn
    ports:
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro
    command: -c /etc/turnserver.conf
    networks:
      - chord-network
    restart: unless-stopped

volumes:
  sqlserver_data:
  redis_data:
  minio_data:

networks:
  chord-network:
    driver: bridge






