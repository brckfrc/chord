# Chord CD Pipeline
# Builds and deploys to production after CI passes on main
# Uses Blue-Green deployment strategy
#
# Skip CI: Use [skip ci], [ci skip], [no ci], [skip actions], or [actions skip] in commit message
# Skip Deploy: Use [skip deploy] or [deploy skip] in commit message
# Note: Deploy also skips if CI workflow is skipped

name: Deploy

on:
  # Trigger after CI workflow completes on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: # Manual trigger

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "20"

jobs:
  # Check if CI passed (for manual triggers)
  check-ci:
    name: Check CI Status & Deploy Skip
    runs-on: ubuntu-latest
    outputs:
      ci_passed: ${{ steps.check-dispatch.outputs.passed || steps.check-run.outputs.passed }}
      should_deploy: ${{ steps.check-deploy.outputs.should_deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 1

      - name: Check commit message for skip deploy
        id: check-deploy
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          
          # Check for skip deploy keywords (case-insensitive)
          if echo "$COMMIT_MSG" | grep -qiE "\[skip deploy\]|\[deploy skip\]"; then
            echo "Deploy skipped due to commit message"
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Check last CI workflow status
        id: check-dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: workflows } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              per_page: 1
            });

            if (workflows.workflow_runs.length === 0) {
              core.setFailed('No CI workflow found');
              return;
            }

            const lastRun = workflows.workflow_runs[0];
            if (lastRun.conclusion !== 'success') {
              core.setFailed(`Last CI workflow failed: ${lastRun.conclusion}`);
              return;
            }

            core.setOutput('passed', 'true');

      - name: Set CI passed for workflow_run
        id: check-run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: echo "passed=true" >> $GITHUB_OUTPUT
        shell: bash

  # Build and push Docker images
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: check-ci
    # Only run if CI passed and deploy is not skipped
    if: needs.check-ci.outputs.ci_passed == 'true' && needs.check-ci.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to Container Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/api:latest
          cache-from: |
            type=gha,scope=deploy-backend
            type=gha,scope=ci-backend
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/api:latest
          cache-to: type=gha,mode=max,scope=deploy-backend
          labels: ${{ steps.meta.outputs.labels }}

      # Build and push Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
          cache-from: |
            type=gha,scope=deploy-frontend
            type=gha,scope=ci-frontend
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
          cache-to: type=gha,mode=max,scope=deploy-frontend
          labels: ${{ steps.meta.outputs.labels }}

  # Deploy to VPS (disabled until VPS is configured)
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [check-ci, build-and-push] # check-ci added
    environment: production
    if: needs.check-ci.outputs.should_deploy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          COMPOSE_FILES: ${{ vars.COMPOSE_FILES || '-f docker-compose.deploy.yml' }}
          RateLimiting__AllowLoadTestBypass: ${{ vars.RateLimiting__AllowLoadTestBypass || vars.RATELIMITING__ALLOWLOADTESTBYPASS || 'false' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: IMAGE_TAG,REGISTRY,REPO,DEPLOY_PATH,GHCR_TOKEN,GHCR_USER,COMPOSE_FILES,RateLimiting__AllowLoadTestBypass,RATELIMITING__ALLOWLOADTESTBYPASS
          script: |
            cd "${DEPLOY_PATH:-/opt/chord}"

            # Pull latest deploy scripts
            git pull origin main

            # Login to GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Export rate limiting bypass (from GitHub variable)
            # Support both uppercase and lowercase variable names (GitHub variables may be uppercase)
            RATE_BYPASS_VALUE="${RateLimiting__AllowLoadTestBypass:-${RATELIMITING__ALLOWLOADTESTBYPASS:-false}}"
            export RateLimiting__AllowLoadTestBypass="$RATE_BYPASS_VALUE"

            # Run blue-green deployment
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh \
              --image-tag "$IMAGE_TAG" \
              --registry "$REGISTRY" \
              --repo "$REPO" \
              $COMPOSE_FILES

      - name: Health Check
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: DEPLOY_PATH
          script: |
            sleep 10
            cd "${DEPLOY_PATH:-/opt/chord}"
            # Check active stack and use correct ports
            ACTIVE=$(cat .deploy-state)
            if [ "$ACTIVE" == "blue" ]; then
              API_PORT=5002
              FRONTEND_PORT=3002
            else
              API_PORT=5003
              FRONTEND_PORT=3003
            fi
            # Internal health check (no SSL issues)
            curl -f http://localhost:$API_PORT/health || exit 1
            curl -f http://localhost:$FRONTEND_PORT/health || exit 1

      - name: Notify Success
        if: success()
        run: |
          echo "Deployment successful!"
          echo "Image: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}"

      - name: Notify Failure
        if: failure()
        run: |
          echo "Deployment failed! Check logs for details."
          # Add Slack/Discord webhook notification here if needed
